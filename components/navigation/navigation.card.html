<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:24px;}
  .card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:18px 22px;box-shadow:var(--shadow-sm);}
  .grp{display:flex;gap:12px;align-items:center;margin-top:16px;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Tabs, Avatar } = window.MasarDesignSystem_dfb72a;
    function Demo(){
      const [t,setT] = React.useState('today');
      return (
        <div className="card">
          <Tabs value={t} onChange={setT} items={[
            {value:'today',label:'Today'},
            {value:'journey',label:'Learning Journey'},
            {value:'tickets',label:'Tickets',count:3},
          ]}/>
          <div className="grp">
            <Avatar name="Yousef Adel" size={44} status="live"/>
            <Avatar name="Lina Hassan" size={44} status="present"/>
            <Avatar name="Omar Khaled" size={44} status="absent"/>
            <Avatar name="Ms Sara" size={44}/>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
