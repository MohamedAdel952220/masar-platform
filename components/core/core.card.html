<!-- @dsCard group="Components" viewport="700x300" name="Core — Buttons, Badges, Inputs" subtitle="Primary actions, pills, fields." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:22px 24px;}
  .grp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);width:100%;margin-bottom:2px;}
  .row{display:flex;gap:22px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}
</style>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Badge, Input, Icon } = window.MasarDesignSystem_dfb72a;
    function Demo(){
      return (
        <div>
          <div className="row">
            <div className="col">
              <div className="lbl">Buttons</div>
              <div className="grp">
                <Button variant="primary">Generate QR</Button>
                <Button variant="secondary" iconLeft={<Icon name="bus" size={16}/>}>Track bus</Button>
                <Button variant="ghost">Cancel</Button>
                <Button variant="danger">Remove</Button>
                <Button variant="primary" disabled>Disabled</Button>
              </div>
              <div className="grp">
                <Button size="sm">Small</Button>
                <Button size="md">Medium</Button>
                <Button size="lg">Large</Button>
              </div>
            </div>
          </div>
          <div className="lbl">Badges</div>
          <div className="grp">
            <Badge tone="teal">Level 3</Badge>
            <Badge tone="success" dot>Present</Badge>
            <Badge tone="amber" solid>Live</Badge>
            <Badge tone="danger" dot>Absent</Badge>
            <Badge tone="info">Excused</Badge>
            <Badge tone="neutral">Draft</Badge>
          </div>
          <div className="lbl">Inputs</div>
          <div className="grp" style={{maxWidth:520}}>
            <Input label="Child name" placeholder="e.g. Yousef Adel" style={{flex:1,minWidth:200}}/>
            <Input label="Pending amount" error="Required" iconLeft={<Icon name="credit-card" size={16}/>} placeholder="0.00" style={{flex:1,minWidth:200}}/>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    setTimeout(()=>window.lucide&&window.lucide.createIcons(),60);
  </script>
</body></html>
