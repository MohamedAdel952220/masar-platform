<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masar — Reception App</title>
<link rel="stylesheet" href="../../styles.css">
<style>

  body{margin:0;background:var(--bg-sunken);font-family:var(--font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .phone{width:390px;height:844px;background:var(--bg-app);border-radius:46px;box-shadow:0 8px 16px rgba(20,20,18,.06),0 50px 100px -30px rgba(20,20,18,.45);border:1px solid var(--border-subtle);position:relative;overflow:hidden;}

<script type="text/babel" src="ReceptionSettings.jsx"></script>
<script type="text/babel" src="ReceptionApp.jsx"></script>
</head>
