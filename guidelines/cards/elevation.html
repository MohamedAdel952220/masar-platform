<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Soft, warm-tinted shadows — xs → xl." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:24px;}
  .row{display:flex;gap:22px;}
  .col{display:flex;flex-direction:column;gap:10px;align-items:center;}
  .b{width:92px;height:64px;background:var(--surface-card);border-radius:var(--radius-md);}
  .l{font-size:11px;font-family:var(--font-mono);color:var(--text-muted);}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="b" style="box-shadow:var(--shadow-xs)"></div><span class="l">xs</span></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-sm)"></div><span class="l">sm</span></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-md)"></div><span class="l">md</span></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-lg)"></div><span class="l">lg</span></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-xl)"></div><span class="l">xl</span></div>
  </div>
</body></html>
