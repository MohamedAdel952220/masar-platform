<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8px base grid · 4 → 96px." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:20px 24px;}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .bar{background:var(--primary);border-radius:3px;width:22px;}
  .l{font-size:10px;font-family:var(--font-mono);color:var(--text-subtle);}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:8px"></div><span class="l">8</span></div>
    <div class="col"><div class="bar" style="height:12px"></div><span class="l">12</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span class="l">16</span></div>
    <div class="col"><div class="bar" style="height:24px"></div><span class="l">24</span></div>
    <div class="col"><div class="bar" style="height:32px"></div><span class="l">32</span></div>
    <div class="col"><div class="bar" style="height:48px"></div><span class="l">48</span></div>
    <div class="col"><div class="bar" style="height:64px"></div><span class="l">64</span></div>
    <div class="col"><div class="bar" style="height:96px"></div><span class="l">96</span></div>
  </div>
</body></html>
