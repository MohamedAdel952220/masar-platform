<!-- @dsCard group="Type" viewport="700x180" name="Display · Plus Jakarta Sans" subtitle="Headlines & numbers — 800/700, tight tracking." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:20px 24px;color:var(--text-strong);}
  .xl{font-size:var(--text-4xl);font-weight:var(--weight-extra);letter-spacing:var(--tracking-tight);line-height:1.05;}
  .lg{font-size:var(--text-2xl);font-weight:var(--weight-bold);letter-spacing:var(--tracking-snug);margin-top:6px;}
  .meta{font-size:var(--text-xs);color:var(--text-subtle);margin-top:12px;font-weight:600;letter-spacing:.04em;}
</style></head>
<body>
  <div class="xl">Today's day path</div>
  <div class="lg">In Classroom · 9:42 AM</div>
  <div class="meta">Jakarta Sans 800 / 700 · tracking −0.02em</div>
</body></html>
