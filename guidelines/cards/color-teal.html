<!-- @dsCard group="Colors" viewport="700x150" name="Brand · Teal scale" subtitle="Primary — trust & care. 600 is the default." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:18px 20px;}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .c{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;}
  .n{font-size:11px;font-weight:700;}
  .h{font-size:10px;font-variant-numeric:tabular-nums;opacity:.8;}
  .lo{color:var(--neutral-900);} .hi{color:#fff;}
</style></head>
<body>
  <div class="row">
    <div class="c lo" style="background:var(--teal-50)"><span class="n">50</span><span class="h">#E7F2EE</span></div>
    <div class="c lo" style="background:var(--teal-100)"><span class="n">100</span><span class="h">#C9E4DC</span></div>
    <div class="c lo" style="background:var(--teal-200)"><span class="n">200</span><span class="h">#9CCFC0</span></div>
    <div class="c lo" style="background:var(--teal-300)"><span class="n">300</span><span class="h">#5FB29C</span></div>
    <div class="c hi" style="background:var(--teal-400)"><span class="n">400</span><span class="h">#2C9079</span></div>
    <div class="c hi" style="background:var(--teal-500)"><span class="n">500</span><span class="h">#14785F</span></div>
    <div class="c hi" style="background:var(--teal-600)"><span class="n">600 ●</span><span class="h">#0F6E56</span></div>
    <div class="c hi" style="background:var(--teal-700)"><span class="n">700</span><span class="h">#0C5644</span></div>
    <div class="c hi" style="background:var(--teal-800)"><span class="n">800</span><span class="h">#0E3A30</span></div>
    <div class="c hi" style="background:var(--teal-900)"><span class="n">900</span><span class="h">#0E2422</span></div>
  </div>
</body></html>
