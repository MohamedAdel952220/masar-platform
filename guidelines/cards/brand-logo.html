<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:0;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 20px;}
  .cell{border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;height:74px;}
  .light{background:var(--surface-card);border:1px solid var(--border-subtle);}
  .dark{background:var(--surface-dark);}
</style></head>
<body>
  <div class="grid">
    <div class="cell light"><img src="../../assets/masar-logo.svg" height="34" alt="Masar"></div>
    <div class="cell dark"><img src="../../assets/masar-logo-dark.svg" height="34" alt="Masar"></div>
    <div class="cell light"><img src="../../assets/masar-logo-ar.svg" height="34" alt="مسار"></div>
    <div class="cell dark"><img src="../../assets/masar-appicon.svg" height="48" alt="app icon" style="margin-left:0"><img src="../../assets/masar-mark.svg" height="30" style="margin-left:24px" alt="mark"></div>
  </div>
</body></html>
