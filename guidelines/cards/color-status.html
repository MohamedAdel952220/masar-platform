<!-- @dsCard group="Colors" viewport="700x170" name="Day-path & attendance status" subtitle="The signature pattern: done (teal) · live (amber) · pending." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:18px 20px;color:var(--text-body);}
  .path{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin-bottom:18px;}
  .step{display:flex;align-items:center;gap:8px;}
  .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--status-done);}
  .dot.done{background:var(--status-done);}
  .dot.live{background:var(--status-live);border-color:var(--status-live);box-shadow:var(--shadow-amber);}
  .dot.pend{border-color:var(--status-pending);}
  .seg{width:30px;height:2px;background:var(--status-done);opacity:.4;}
  .seg.f{background:var(--border-subtle);opacity:1;}
  .lbl{font-size:11px;font-weight:600;}
  .att{display:flex;gap:8px;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:var(--radius-pill);}
  .pdot{width:7px;height:7px;border-radius:50%;}
</style></head>
<body>
  <div class="path">
    <div class="step"><span class="dot done"></span><span class="lbl">In Bus</span></div><span class="seg"></span>
    <div class="step"><span class="dot done"></span><span class="lbl">Arrived</span></div><span class="seg"></span>
    <div class="step"><span class="dot live"></span><span class="lbl">In Classroom</span></div><span class="seg f"></span>
    <div class="step"><span class="dot pend"></span><span class="lbl">Nap Time</span></div><span class="seg f"></span>
    <div class="step"><span class="dot pend"></span><span class="lbl">Home</span></div>
  </div>
  <div class="att">
    <span class="pill" style="background:var(--success-50);color:var(--success-700)"><span class="pdot" style="background:var(--attend-present)"></span>Present</span>
    <span class="pill" style="background:var(--danger-50);color:var(--danger-700)"><span class="pdot" style="background:var(--attend-absent)"></span>Absent</span>
    <span class="pill" style="background:var(--amber-50);color:var(--amber-700)"><span class="pdot" style="background:var(--attend-late)"></span>Late</span>
    <span class="pill" style="background:var(--info-50);color:var(--info-700)"><span class="pdot" style="background:var(--attend-excused)"></span>Excused</span>
  </div>
</body></html>
