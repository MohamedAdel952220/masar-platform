<!-- @dsCard group="Brand" viewport="700x200" name="The mark in motion" subtitle="Done · live · pending — the logo IS the status feature." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:22px 24px;color:var(--text-body);display:flex;align-items:center;gap:28px;}
  .mark{display:flex;align-items:center;}
  .dot{width:16px;height:16px;border-radius:50%;}
  .seg{width:30px;height:3px;border-radius:2px;}
  .copy{font-size:13px;line-height:1.55;max-width:330px;}
  .copy b{color:var(--text-strong);}
</style></head>
<body>
  <div class="mark">
    <span class="dot" style="background:var(--teal-600)"></span>
    <span class="seg" style="background:var(--teal-600);opacity:.35"></span>
    <span class="dot" style="background:var(--teal-600)"></span>
    <span class="seg" style="background:var(--border-subtle)"></span>
    <span class="dot" style="background:var(--amber-500);width:20px;height:20px;box-shadow:var(--shadow-amber)"></span>
  </div>
  <p class="copy"><b>Two completed steps</b> in teal, the <b>live step</b> in amber. The mark is the child's day rendered as a path — and reappears as the live-status indicator across every screen.</p>
</body></html>
