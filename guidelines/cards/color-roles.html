<!-- @dsCard group="Colors" viewport="700x150" name="Role accents · 8 portals" subtitle="Each portal carries its own accent for instant orientation." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:18px 20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .r{display:flex;align-items:center;gap:9px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:9px 11px;}
  .dot{width:18px;height:18px;border-radius:6px;flex:none;}
  .l{font-size:12px;font-weight:600;color:var(--text-body);}
</style></head>
<body>
  <div class="grid">
    <div class="r"><span class="dot" style="background:var(--role-parent)"></span><span class="l">Parent</span></div>
    <div class="r"><span class="dot" style="background:var(--role-teacher)"></span><span class="l">Teacher</span></div>
    <div class="r"><span class="dot" style="background:var(--role-driver)"></span><span class="l">Driver</span></div>
    <div class="r"><span class="dot" style="background:var(--role-supervisor)"></span><span class="l">Supervisor</span></div>
    <div class="r"><span class="dot" style="background:var(--role-manager)"></span><span class="l">Manager</span></div>
    <div class="r"><span class="dot" style="background:var(--role-accountant)"></span><span class="l">Accountant</span></div>
    <div class="r"><span class="dot" style="background:var(--role-support)"></span><span class="l">Support</span></div>
    <div class="r"><span class="dot" style="background:var(--role-admin)"></span><span class="l">Super Admin</span></div>
  </div>
</body></html>
