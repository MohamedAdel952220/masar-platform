<!-- @dsCard group="Colors" viewport="700x150" name="Accent · Amber scale" subtitle="The single 'live / happening now' accent — 500." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:18px 20px;}
  .row{display:flex;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .c{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;}
  .n{font-size:11px;font-weight:700;} .h{font-size:10px;font-variant-numeric:tabular-nums;opacity:.8;}
  .lo{color:var(--neutral-900);} .hi{color:#fff;}
</style></head>
<body>
  <div class="row">
    <div class="c lo" style="background:var(--amber-50)"><span class="n">50</span><span class="h">#FDF3E0</span></div>
    <div class="c lo" style="background:var(--amber-100)"><span class="n">100</span><span class="h">#FBE4BD</span></div>
    <div class="c lo" style="background:var(--amber-200)"><span class="n">200</span><span class="h">#F8D291</span></div>
    <div class="c lo" style="background:var(--amber-300)"><span class="n">300</span><span class="h">#F4BC5E</span></div>
    <div class="c lo" style="background:var(--amber-400)"><span class="n">400</span><span class="h">#F1AC3F</span></div>
    <div class="c lo" style="background:var(--amber-500)"><span class="n">500 ●</span><span class="h">#EF9F27</span></div>
    <div class="c hi" style="background:var(--amber-600)"><span class="n">600</span><span class="h">#D6850F</span></div>
    <div class="c hi" style="background:var(--amber-700)"><span class="n">700</span><span class="h">#A86610</span></div>
  </div>
</body></html>
