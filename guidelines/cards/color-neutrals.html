<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals · Warm sand" subtitle="Paper surfaces & warm-gray text — never clinical white." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:18px 20px;}
  .row{display:flex;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-subtle);}
  .c{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;}
  .n{font-size:11px;font-weight:700;} .h{font-size:10px;font-variant-numeric:tabular-nums;opacity:.8;}
  .lo{color:var(--neutral-900);} .hi{color:#fff;}
</style></head>
<body>
  <div class="row">
    <div class="c lo" style="background:var(--neutral-0)"><span class="n">0</span><span class="h">#FFFFFF</span></div>
    <div class="c lo" style="background:var(--neutral-50)"><span class="n">50</span><span class="h">#FAF8F3</span></div>
    <div class="c lo" style="background:var(--neutral-100)"><span class="n">100</span><span class="h">#F5F3EE</span></div>
    <div class="c lo" style="background:var(--neutral-200)"><span class="n">200</span><span class="h">#EFEBE2</span></div>
    <div class="c lo" style="background:var(--neutral-300)"><span class="n">300</span><span class="h">#E3E0D6</span></div>
    <div class="c lo" style="background:var(--neutral-400)"><span class="n">400</span><span class="h">#C9C5B8</span></div>
    <div class="c lo" style="background:var(--neutral-500)"><span class="n">500</span><span class="h">#A8A395</span></div>
    <div class="c hi" style="background:var(--neutral-600)"><span class="n">600</span><span class="h">#6E6B61</span></div>
    <div class="c hi" style="background:var(--neutral-700)"><span class="n">700</span><span class="h">#4A4842</span></div>
    <div class="c hi" style="background:var(--neutral-900)"><span class="n">900</span><span class="h">#1C1C1A</span></div>
  </div>
</body></html>
