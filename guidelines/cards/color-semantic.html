<!-- @dsCard group="Colors" viewport="700x150" name="Semantic · Status" subtitle="Success / Warning / Danger / Info — surface + solid." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:18px 20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .item{border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .solid{height:54px;color:#fff;display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;}
  .soft{height:38px;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:600;}
</style></head>
<body>
  <div class="grid">
    <div class="item"><div class="solid" style="background:var(--success-500)">Success</div><div class="soft" style="background:var(--success-50);color:var(--success-700)">#2F8F5B</div></div>
    <div class="item"><div class="solid" style="background:var(--warning-500);color:#1C1C1A">Warning</div><div class="soft" style="background:var(--warning-50);color:var(--warning-700)">#EF9F27</div></div>
    <div class="item"><div class="solid" style="background:var(--danger-500)">Danger</div><div class="soft" style="background:var(--danger-50);color:var(--danger-700)">#D5503A</div></div>
    <div class="item"><div class="solid" style="background:var(--info-500)">Info</div><div class="soft" style="background:var(--info-50);color:var(--info-700)">#2D6CB5</div></div>
  </div>
</body></html>
